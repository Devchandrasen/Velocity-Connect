name: implementation-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  cpu-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: environment/requirements-lock.txt
      - name: Install locked analysis dependencies
        run: python -m pip install -r environment/requirements-lock.txt
      - name: Verify byte-level implementation manifest
        run: python scripts/verify_source_manifest.py
      - name: Run implementation tests
        run: python -m pytest -q
